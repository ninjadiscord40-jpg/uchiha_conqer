<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>سيرفر اوتيشيها كونكر</title>

  <!-- Google Font Cairo -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="overlay">
    <div class="container">

      <h1 class="welcome">
        اهلا بكم من جديد في سيرفر اوتيشيها كونكر
      </h1>

      <div id="countdown" class="countdown"></div>

      <div class="game-link-box">
        <button id="gameButton" disabled>
          رابط اللعبة غير متاح حالياً
        </button>
      </div>

      <div class="images-section">

        <div class="img-box">
          <img src="vip.png" alt="VIP">
        </div>

        <div class="img-box">
          <img src="cup.png" alt="Cup">
        </div>

        <div class="img-box">
          <img src="cps.png" alt="CPS">
        </div>

        <div class="img-box">
          <img src="garment.png" alt="Garment">
        </div>

      </div>

      <h2 class="gift-text">
        هدايه التسجيل اول يوم
      </h2>

    </div>
  </div>

<script src="script.js"></script>
</body>
</html>
